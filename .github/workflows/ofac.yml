name: ofac
# Mirrors the digital currency addresses from the U.S. Treasury OFAC SDN list to branch "ofac-data"
# (sdn-dca.json), for the BotsRated test-buy Worker, which cannot reach Treasury from Cloudflare.
# It never touches main or the anchor data. Consumers fail closed when fetched_at is older than 48 h.
# Uses only the built-in GITHUB_TOKEN; no secrets.
on:
  schedule:
    # 10 off-peak slots/day across odd minutes so dropped GitHub cron runs cannot breach the 48 h TTL.
    - cron: "11 */4 * * *"      # 00:11, 04:11, 08:11, 12:11, 16:11, 20:11 UTC
    - cron: "41 1,7,13,19 * * *" # 01:41, 07:41, 13:41, 19:41 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ofac
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ofac-data
      - name: Download and check the list (fails, and commits nothing, if the download or sanity floors fail)
        run: node --version && node scripts/update.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sdn-dca.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "sdn-dca: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:ofac-data
