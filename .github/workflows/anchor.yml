name: anchor
# Copies each finalized BotsRated anchor here (checked first), then upgrades pending OpenTimestamps proofs
# once Bitcoin confirms. Uses only the built-in GITHUB_TOKEN; no secrets.
on:
  schedule:
    - cron: "50 */3 * * *"   # 00:50, 03:50, ... UTC: the first run after each UTC midnight is 00:50
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: anchor
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a moving tag. These are the commits the v4 and v5 tags named on 2026-11-23.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client
        # Exact version, so a new upstream release is not picked up by itself. Its own dependencies are not
        # hash-locked yet; see the README section "Workflow pins".
        run: pip install "opentimestamps-client==0.7.1"
      - name: Copy new final anchors (verified)
        run: python3 scripts/sync.py
      - name: Upgrade pending OpenTimestamps proofs
        run: |
          shopt -s nullglob
          for f in proofs/*.ots; do
            if ots info "$f" | grep -q "PendingAttestation"; then ots upgrade "$f" || true; fi
          done
          rm -f proofs/*.ots.bak
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the data folders are committed. Anything else the steps above changed is reported, not committed.
          git add -- days leaves proofs genesis log.csv
          other="$(git status --porcelain -- . ':!days' ':!leaves' ':!proofs' ':!genesis' ':!log.csv')"
          if [ -n "$other" ]; then echo "::warning::changes outside the data folders were not committed"; echo "$other"; fi
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "anchor: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
